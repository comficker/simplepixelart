name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 45.76.181.237 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 root@45.76.181.237 << 'EOF'
            cd /home/frontend/simplepixelart
            git stash
            git pull origin main
            rm -rf .output
            rm -rf .nuxt
            pm2 stop simplepixelart
            # Install bun if missing (idempotent — official installer is safe to re-run)
            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
            fi
            export PATH="$HOME/.bun/bin:$PATH"
            bun install
            bun run build
            pm2 restart simplepixelart
          EOF
