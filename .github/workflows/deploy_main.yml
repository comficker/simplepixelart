name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the swap.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HOST: 45.76.181.237
  DIR: /home/frontend/simplepixelart

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      # Built here, not on the VPS. The box has 2 GB and the Nuxt build now
      # needs more than that: on 2026-09-25 it died with a V8
      # FatalProcessOutOfMemory, and because the old step removed .output
      # before building, the site was left with nothing to serve.
      - name: Build
        run: bun run build

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload
        run: rsync -az --no-owner --no-group --delete -e "ssh -i ~/.ssh/id_ed25519" .output/ "root@$HOST:$DIR/.output.new/"

      # Swap the new build in, then restart; the running one stays untouched
      # until a complete upload is sitting next to it.
      - name: Release
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@$HOST" "DIR=$DIR bash -s" <<'REMOTE'
          set -e
          cd "$DIR"
          git fetch --quiet origin main && git reset --quiet --hard origin/main
          rm -rf .output.old
          [ -d .output ] && mv .output .output.old
          mv .output.new .output
          pm2 restart simplepixelart --update-env
          rm -rf .output.old
          REMOTE

      # The old step ran the build inside an `ssh <<EOF` heredoc, so the exit
      # code came from the last line (pm2 restart) and a failed build still
      # reported a green deploy.
      # pm2 restart returns before Nitro is listening, and a path can still
      # 502 for a moment after the first one answers -- waiting on / alone
      # failed a deploy on 2026-09-26 that had in fact gone through. Every
      # path gets its own retry.
      # The retries never ran when it mattered. `run:` is executed with
      # `bash -e`, and `code=$(curl ...)` is a plain assignment, so any curl
      # that exits non-zero -- a stalled connection, a reset, a timeout --
      # takes the whole step down before the loop can try again. Twice on
      # 2026-09-30, on releases that were live and serving: /arts left no
      # trace in nginx's log and none in Cloudflare's firewall events, which
      # is what a connection that never completed looks like.
      # `|| true` keeps the assignment succeeding; curl still writes 000 to
      # stdout for a transport failure, so it is retried like any other
      # non-200. --max-time bounds a single stalled attempt.
      - name: Smoke test
        run: |
          for p in / /ja/ /editor /arts /sitemap-index.xml; do
            code=000
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' "https://simplepixelart.com$p" || true)
              if [ "$code" = 200 ]; then break; fi
              sleep 5
            done
            echo "$p $code (attempt $i)"
            if [ "$code" != 200 ]; then exit 1; fi
          done
